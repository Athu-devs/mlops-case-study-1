name: Deploy to Hugging Face Space

on:
  push:
    branches: [dev]   # change to [main] or [dev, main] if you want
  workflow_dispatch:

concurrency:
  group: hf-space-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (full history + LFS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Ensure Git LFS is set up
        run: git lfs install

      - name: Push current branch to Space main
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # you already created this secret
        run: |
          HF_USERNAME="athulya21"
          HF_SPACE="case1-api"
          echo "Pushing ${GITHUB_REF_NAME} -> ${HF_USERNAME}/${HF_SPACE}:main"
          git remote remove space 2>/dev/null || true
          git remote add space "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}"
          git push space "${GITHUB_REF_NAME}:main" --force
